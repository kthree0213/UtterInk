name: Bug report
description: Report a reproducible problem in the current UtterInk source build.
title: "[Bug]: "
labels: []
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve UtterInk.

        This issue is public. For a suspected vulnerability, stop here and follow the repository-root `SECURITY.md` instructions. Do not put credentials, private transcripts, audio, pasteboard contents, private paths, or other personal data in an issue.

  - type: checkboxes
    id: public-report-safety
    attributes:
      label: Public report safety
      description: Confirm both items before continuing.
      options:
        - label: I have removed credentials, transcripts, audio, pasteboard contents, private paths, and unrelated personal data.
          required: true
        - label: This report does not disclose an unpatched security vulnerability.
          required: true
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Include the full version and build number when available.
      placeholder: "14.x (build ...)"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - Apple Silicon / arm64
        - Other or unknown
    validations:
      required: true

  - type: input
    id: utterink-build
    attributes:
      label: UtterInk build or commit
      description: Provide the commit SHA, branch, or build identifier from the source build you tested.
      placeholder: "Commit SHA or build identifier"
    validations:
      required: true

  - type: dropdown
    id: build-source
    attributes:
      label: How was UtterInk run?
      options:
        - Source build from Xcode
        - Locally produced unsigned build
        - Other or unknown
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the smallest deterministic sequence that reproduces the problem using sanitized example data.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Use sanitized wording and do not paste raw platform errors containing private data.
    validations:
      required: true

  - type: textarea
    id: tests
    attributes:
      label: Tests and checks run
      description: List relevant automated or manual checks and their results. If none were run, say why.
      placeholder: |
        - Command or manual scenario:
        - Result:
    validations:
      required: true

  - type: textarea
    id: accessibility-impact
    attributes:
      label: Accessibility impact
      description: Describe any impact on keyboard control, VoiceOver, focus, permissions, target validation, or Automatic Paste. Write "No known impact" if none.
    validations:
      required: true

  - type: textarea
    id: privacy-security-impact
    attributes:
      label: Privacy and security impact
      description: Describe the sanitized impact, or write "No known impact." Report sensitive vulnerabilities privately through SECURITY.md instead.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Optional. Paste only the allowlisted preview/export from UtterInk after reviewing it. Remove private paths and do not add transcripts, audio, credentials, prompts, pasteboard contents, window titles, raw errors, response bodies, or full provider URLs.
      render: text
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Sanitized screenshots
      description: Optional. Crop and redact screenshots so they contain no transcripts, credentials, private paths, pasteboard contents, personal window titles, or other private data.
    validations:
      required: false

  - type: checkboxes
    id: attachment-rights
    attributes:
      label: Attachment confirmation
      options:
        - label: I reviewed every attachment for private content and have the right to submit it publicly.
          required: true
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional sanitized context
      description: Optional links or details that are safe to publish.
    validations:
      required: false
