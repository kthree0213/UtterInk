name: UtterInk
options:
  xcodeVersion: "26.4"
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  UtterInkKit:
    path: Packages/UtterInkKit
targets:
  UtterInk:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: App
    info:
      path: App/Supporting/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: UtterInk
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: UtterInk
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSMicrophoneUsageDescription: UtterInk uses the microphone to transcribe speech locally on this Mac.
    entitlements:
      path: App/Supporting/UtterInk.entitlements
      properties:
        com.apple.security.device.audio-input: true
    dependencies:
      - package: UtterInkKit
        product: UtterInkCore
      - package: UtterInkKit
        product: UtterInkServices
    settings:
      base:
        PRODUCT_NAME: UtterInk
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  ATSPolicyProbe:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/ATSPolicyProbe/ATSPolicyProbeApp.swift
    info:
      path: Tests/ATSPolicyProbe/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: ATSPolicyProbe
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: ATSPolicyProbe
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
    dependencies:
      - package: UtterInkKit
        product: UtterInkCore
      - package: UtterInkKit
        product: UtterInkServices
    settings:
      base:
        PRODUCT_NAME: ATSPolicyProbe
        PRODUCT_BUNDLE_IDENTIFIER: dev.utterink.ATSPolicyProbe
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ARCHS: arm64
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
  UtterInkAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: UtterInkAppTests
    dependencies:
      - target: UtterInk
      - package: UtterInkKit
        product: UtterInkCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/UtterInk.app/Contents/MacOS/UtterInk"
        BUNDLE_LOADER: "$(TEST_HOST)"
  UtterInkUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: UtterInkUITests
    dependencies:
      - target: UtterInk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  UtterInk:
    build:
      targets:
        UtterInk: all
        UtterInkAppTests: [test]
        UtterInkUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: UtterInkAppTests
        - name: UtterInkUITests
    archive:
      config: Release
  ATSPolicyProbe:
    build:
      targets:
        ATSPolicyProbe: all
    run:
      config: Debug
